<div data-contragent-modal-overlay class="contragent-modal-overlay hidden fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4">
    <div class="w-full max-w-lg bg-white rounded-lg shadow">
        <div class="flex items-center justify-between p-4 border-b border-gray-200">
            <h2 class="text-lg font-semibold text-gray-900">Контрагент</h2>
            <button
                    type="button"
                    data-cancel-button
                    class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 inline-flex justify-center items-center"
            >
                <span class="sr-only">Закрыть</span>
                <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"/>
                </svg>
            </button>
        </div>
        <form data-contragent-form class="p-4 md:p-5">
            <div class="grid gap-4 mb-4">
                <div>
                    <label for="contragent-name" class="block mb-2 text-sm font-medium text-gray-900">Наименование</label>
                    <input
                            id="contragent-name"
                            name="name"
                            type="text"
                            required
                            class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
                            placeholder="ООО Ромашка"
                    >
                </div>
                <div>
                    <label for="contragent-inn" class="block mb-2 text-sm font-medium text-gray-900">ИНН</label>
                    <input
                            id="contragent-inn"
                            name="inn"
                            type="text"
                            required
                            class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
                            placeholder="7701234567"
                    >
                </div>
                <div>
                    <label for="contragent-address" class="block mb-2 text-sm font-medium text-gray-900">Адрес</label>
                    <input
                            id="contragent-address"
                            name="address"
                            type="text"
                            required
                            class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
                            placeholder="г. Москва, ул. Пример, 1"
                    >
                </div>
                <div>
                    <label for="contragent-kpp" class="block mb-2 text-sm font-medium text-gray-900">КПП</label>
                    <input
                            id="contragent-kpp"
                            name="kpp"
                            type="text"
                            required
                            class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
                            placeholder="770101001"
                    >
                </div>
            </div>
            <div class="flex items-center justify-end gap-3">
                <button
                        type="button"
                        data-cancel-button
                        class="py-2.5 px-5 text-sm font-medium text-gray-900 bg-white rounded-lg border border-gray-300 hover:bg-gray-100 hover:text-blue-700 focus:outline-none focus:ring-4 focus:ring-gray-100"
                >
                    Отменить
                </button>
                <button
                        type="submit"
                        class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 focus:outline-none"
                >
                    Сохранить
                </button>
            </div>
        </form>
    </div>
</div>
